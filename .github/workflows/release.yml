name: Release

# Pushing a tag like v0.1.0 builds "Mac Cleaner.app" on a macOS runner and
# publishes the DMG and PKG as a GitHub Release, so people can download them
# straight from the Releases page.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build app, DMG and PKG
        run: npm run app
      - name: Stable download names
        run: |
          cd build
          cp MacCleaner-*-arm64.dmg MacCleaner-arm64.dmg
          cp MacCleaner-*-arm64.pkg MacCleaner-arm64.pkg
          shasum -a 256 *.dmg *.pkg > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            build/*.dmg
            build/*.pkg
            build/SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.dmg
            build/*.pkg
            build/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            Download **MacCleaner-arm64.dmg** (Apple silicon), open it and drag Mac Cleaner to Applications.

            The app is ad-hoc signed, not notarized. On first launch macOS says it cannot verify the developer:
            open System Settings → Privacy & Security and click **Open Anyway**, or run
            `xattr -d com.apple.quarantine "/Applications/Mac Cleaner.app"` in Terminal.
