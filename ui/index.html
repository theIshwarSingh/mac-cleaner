<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mac Cleaner</title>
<style>
  :root {
    --window: #f2f3f5; --panel: #ffffff; --ink: #1b1d22; --muted: #6b7079; --rule: #e1e4e9; --rule-soft: #eceef2;
    --hover: #f6f7f9; --reclaim: #0e7a6b; --reclaim-soft: #bfe3dc; --free: #e6e8ec; --used: #a9afb9;
    --danger: #b3372c; --warn: #8a5a00; --focus: #2f6fed;
    --control-bg: #ffffff; --control-ink: #1b1d22; --primary-bg: #1b1d22; --primary-ink: #ffffff;
    color-scheme: light;
  }
  /* Appearance: follows the system unless data-theme pins it (saved in ~/.mac-cleaner/settings.json). */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --window: #1b1d21; --panel: #24272c; --ink: #eceef1; --muted: #9aa1ab; --rule: #33373e; --rule-soft: #2c3036;
      --hover: #2a2e34; --reclaim: #3fb39f; --reclaim-soft: #27564e; --free: #30343b; --used: #5c636d;
      --danger: #e2675b; --warn: #d9a441; --control-bg: #2c3036; --control-ink: #eceef1; --primary-bg: #eceef1; --primary-ink: #1b1d21;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --window: #1b1d21; --panel: #24272c; --ink: #eceef1; --muted: #9aa1ab; --rule: #33373e; --rule-soft: #2c3036;
      --hover: #2a2e34; --reclaim: #3fb39f; --reclaim-soft: #27564e; --free: #30343b; --used: #5c636d;
      --danger: #e2675b; --warn: #d9a441; --control-bg: #2c3036; --control-ink: #eceef1; --primary-bg: #eceef1; --primary-ink: #1b1d21;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--window); color: var(--ink);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased; display: grid; grid-template-columns: 232px minmax(0, 1fr);
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* Sidebar */
  .side { background: var(--panel); border-right: 1px solid var(--rule); padding: 20px 10px 14px; display: flex; flex-direction: column; min-height: 100vh; position: sticky; top: 0; height: 100vh; }
  .brand { padding: 0 10px 18px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .brand small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .side h2 { font-size: 11px; font-weight: 500; color: var(--muted); margin: 14px 10px 6px; }
  .navbtn { all: unset; cursor: pointer; display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 7px 10px; border-radius: 6px; width: 100%; }
  .navbtn:hover { background: var(--hover); }
  .navbtn[aria-current="page"] { background: var(--ink); color: var(--panel); }
  .navbtn .amt { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
  .navbtn[aria-current="page"] .amt { color: inherit; opacity: .7; }
  .navbtn .amt.has { color: var(--reclaim); font-weight: 500; }
  .side .grow { flex: 1; }
  .theme { display: flex; margin: 0 10px 14px; padding: 2px; border: 1px solid var(--rule); border-radius: 7px; background: var(--window); }
  .themebtn { all: unset; flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px; padding: 4px 0; border-radius: 5px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .themebtn:hover { color: var(--ink); }
  .themebtn[aria-checked="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
  .themebtn:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .themebtn svg { width: 13px; height: 13px; flex: none; }
  .side .foot { padding: 10px 10px 0; color: var(--muted); font-size: 11.5px; line-height: 1.4; }

  /* Main */
  main { padding: 26px 32px 0; max-width: 1180px; width: 100%; }
  .top { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .top h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.015em; }
  .top p { margin: 2px 0 0; color: var(--muted); }
  .top .actions { margin-left: auto; display: flex; gap: 8px; }
  .btn { border: 1px solid var(--rule); background: var(--control-bg); color: var(--control-ink); border-radius: 6px; padding: 6px 12px; cursor: pointer; line-height: 1.4; }
  .btn:hover { background: var(--hover); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--primary-bg); color: var(--primary-ink); border-color: transparent; }
  .btn.primary:hover { opacity: .9; }
  .btn.trash { background: var(--danger); color: #fff; border-color: transparent; }
  .btn.small { padding: 2px 8px; font-size: 12px; }

  /* Storage strip: the one bold element */
  .strip { margin-bottom: 26px; }
  .strip .num { font-size: 34px; font-weight: 300; letter-spacing: -0.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .strip .num b { font-weight: 600; color: var(--reclaim); }
  .strip .lead { color: var(--muted); margin: 4px 0 14px; max-width: 64ch; }
  .bar { display: flex; height: 22px; border-radius: 4px; overflow: hidden; background: var(--free); }
  .bar i { display: block; height: 100%; transition: width .45s cubic-bezier(.2,.7,.2,1); min-width: 0; }
  .bar .used { background: var(--used); }
  .bar .sel { background: var(--reclaim); }
  .bar .found { background: repeating-linear-gradient(135deg, var(--reclaim-soft) 0 5px, transparent 5px 9px); }
  .legend { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 10px; color: var(--muted); font-size: 12.5px; }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 7px; vertical-align: -1px; background: var(--free); }
  .legend .l-used::before { background: var(--used); } .legend .l-sel::before { background: var(--reclaim); } .legend .l-found::before { background: repeating-linear-gradient(135deg, var(--reclaim-soft) 0 3px, transparent 3px 5px); }
  .legend em { font-style: normal; color: var(--ink); font-variant-numeric: tabular-nums; }

  /* Groups as a ruled list */
  .module-title { font-size: 15px; font-weight: 600; margin: 28px 0 6px; display: flex; align-items: baseline; gap: 10px; }
  .module-title span { font-weight: 400; color: var(--muted); font-size: 13px; }
  .grp { border-top: 1px solid var(--rule); }
  .grp:last-child { border-bottom: 1px solid var(--rule); }
  .grp-row { display: grid; grid-template-columns: 24px minmax(0, 1fr) 150px 20px; align-items: center; gap: 12px; padding: 11px 6px 11px 4px; cursor: pointer; }
  .grp-row:hover { background: var(--hover); }
  .grp-row .t { font-weight: 500; }
  .grp-row .t small { font-weight: 400; color: var(--muted); margin-left: 6px; }
  .grp-row .d { color: var(--muted); font-size: 12.5px; max-width: 72ch; }
  .grp-row .bytes { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
  .grp-row .bytes b { color: var(--reclaim); font-weight: 600; }
  .grp-row .chev { color: var(--muted); text-align: center; transition: transform .2s; }
  .grp.open .chev { transform: rotate(90deg); }
  .notice { margin: -4px 0 10px 40px; color: var(--warn); font-size: 12.5px; }
  .items { margin: 0 0 8px 0; padding: 0; list-style: none; }
  .item { display: grid; grid-template-columns: 24px minmax(0, 1fr) 110px 60px; gap: 12px; align-items: start; padding: 6px 6px 6px 40px; border-top: 1px solid var(--rule-soft); }
  .item:hover { background: var(--hover); }
  .item .name { overflow-wrap: anywhere; }
  .item .path { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .item .flags { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .item .bytes { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
  .item .bytes.on { color: var(--ink); }
  .more { padding: 8px 40px; color: var(--muted); font-size: 12.5px; }
  input[type=checkbox] { width: 15px; height: 15px; margin: 2px 0 0 3px; accent-color: var(--reclaim); }

  .empty { border: 1px dashed var(--rule); border-radius: 8px; padding: 34px 28px; max-width: 60ch; color: var(--muted); }
  .empty b { color: var(--ink); font-weight: 500; display: block; margin-bottom: 4px; }

  .actions-bar { position: sticky; bottom: 0; margin: 20px -32px 0; padding: 12px 32px; background: var(--window); border-top: 1px solid var(--rule); display: flex; align-items: center; gap: 10px; }
  .actions-bar .sum { margin-right: auto; font-variant-numeric: tabular-nums; }
  .actions-bar .sum b { color: var(--reclaim); font-weight: 600; }

  /* Secondary views */
  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0 28px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 10px 0; margin-bottom: 24px; }
  .kv div { padding: 8px 0; }
  .kv .k { color: var(--muted); font-size: 12px; }
  .kv .v { font-size: 20px; font-weight: 300; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .kv .v small { font-size: 12.5px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .meter { height: 4px; background: var(--free); border-radius: 2px; margin-top: 8px; max-width: 160px; } .meter i { display: block; height: 100%; background: var(--used); border-radius: 2px; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 8px 6px; border-top: 1px solid var(--rule-soft); vertical-align: top; }
  th { font-weight: 500; color: var(--muted); font-size: 12px; border-top: 0; }
  td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--muted); }
  tr:hover td { background: var(--hover); }
  .tree div { display: grid; grid-template-columns: 96px 1fr; gap: 14px; padding: 5px 6px; cursor: pointer; border-top: 1px solid var(--rule-soft); }
  .tree div:hover { background: var(--hover); }
  .tree .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .tree .n.big { color: var(--ink); }
  input[type=search] { padding: 6px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--control-bg); min-width: 240px; }
  pre { background: var(--panel); border: 1px solid var(--rule); padding: 10px 12px; border-radius: 6px; overflow: auto; font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; white-space: pre; }
  .log { max-height: 300px; }
  dialog { border: 1px solid var(--rule); border-radius: 10px; background: var(--window); color: var(--ink); padding: 20px 22px; width: min(640px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h3 { margin: 0 0 6px; font-size: 15px; }
  dialog p { margin: 0 0 12px; color: var(--muted); max-width: 60ch; }
  .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .muted { color: var(--muted); }

  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; }
    .side { position: static; height: auto; min-height: 0; flex-direction: row; flex-wrap: wrap; gap: 2px; padding: 12px; border-right: 0; border-bottom: 1px solid var(--rule); }
    .side .brand, .side h2, .side .grow, .side .foot { display: none; }
    .theme { margin: 0 0 0 auto; width: auto; }
    .themebtn { padding: 4px 8px; }
    .themebtn span { display: none; }
    .navbtn { width: auto; }
    main { padding: 16px 16px 0; }
    .actions-bar { margin: 16px -16px 0; padding: 10px 16px; }
    .grp-row { grid-template-columns: 24px minmax(0, 1fr) 90px 16px; }
    .item { grid-template-columns: 24px minmax(0, 1fr) 80px; padding-left: 12px; }
    .item .reveal { display: none; }
  }
</style>
</head>
<body>
<nav class="side" aria-label="Sections">
  <div class="brand">Mac Cleaner<small>Nothing is removed until you confirm.</small></div>
  <button class="navbtn" data-view="smart" aria-current="page"><span>Smart Care</span><span class="amt" id="amt-smart"></span></button>
  <h2>Modules</h2>
  <button class="navbtn" data-view="cleanup"><span>Cleanup</span><span class="amt" id="amt-cleanup"></span></button>
  <button class="navbtn" data-view="protection"><span>Protection</span><span class="amt" id="amt-protection"></span></button>
  <button class="navbtn" data-view="performance"><span>Performance</span><span class="amt" id="amt-performance"></span></button>
  <button class="navbtn" data-view="applications"><span>Applications</span><span class="amt" id="amt-applications"></span></button>
  <button class="navbtn" data-view="clutter"><span>My Clutter</span><span class="amt" id="amt-clutter"></span></button>
  <h2>Tools</h2>
  <button class="navbtn" data-view="space"><span>Space Lens</span></button>
  <button class="navbtn" data-view="health"><span>Health</span></button>
  <button class="navbtn" data-view="apps"><span>Uninstaller</span></button>
  <div class="grow"></div>
  <h2>Appearance</h2>
  <div class="theme" role="radiogroup" aria-label="Appearance">
    <button class="themebtn" role="radio" aria-checked="false" data-theme="light" title="Light"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg><span>Light</span></button>
    <button class="themebtn" role="radio" aria-checked="false" data-theme="dark" title="Dark"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 10.2A6 6 0 0 1 5.8 2.5a6 6 0 1 0 7.7 7.7z"/></svg><span>Dark</span></button>
    <button class="themebtn" role="radio" aria-checked="false" data-theme="system" title="Match the system"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor" stroke="none"/></svg><span>System</span></button>
  </div>
  <div class="foot">Reports and cleanup logs are kept in ~/.mac-cleaner on this Mac. Nothing is sent anywhere.</div>
</nav>
<main id="main"></main>
<dialog id="dlg"></dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const h = (n) => { if (!n || n < 0) return "0 B"; const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0, v = n; while (v >= 1000 && i < u.length - 1) { v /= 1000; i++; } return `${v < 10 && i ? v.toFixed(1) : Math.round(v)} ${u[i]}`; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const api = async (path, body) => { const r = await fetch("/api" + path, body && { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText); return j; };
const MODULE_NAMES = { smart: "Smart Care", cleanup: "Cleanup", protection: "Protection", performance: "Performance", applications: "Applications", clutter: "My Clutter" };
const canClean = (f) => f.action === "trash" || f.action === "delete";

let report = null, disk = null, view = "smart";

/* ---------- appearance ---------- */
function applyTheme(t) {
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  document.querySelectorAll(".themebtn").forEach((b) => b.setAttribute("aria-checked", String(b.dataset.theme === t)));
}
applyTheme(new URLSearchParams(location.search).get("theme") || document.documentElement.dataset.theme || "system");
api("/settings").then((s) => { if (!new URLSearchParams(location.search).get("theme")) applyTheme(s.theme); }).catch(() => {});
document.querySelectorAll(".themebtn").forEach((b) => b.addEventListener("click", () => {
  applyTheme(b.dataset.theme);
  api("/settings", { theme: b.dataset.theme }).catch(() => {});
}));
const checked = new Set();
const open = new Set();

async function load() {
  [report, disk] = await Promise.all([api("/report"), api("/disk").catch(() => null)]);
  seedChecked();
  render();
}
function seedChecked() { checked.clear(); if (!report) return; for (const f of findings()) if (f.autoSelect && canClean(f)) checked.add(f.id); }
function groupsOf(modId) { return report ? report.modules.filter((m) => !modId || m.id === modId).flatMap((m) => m.groups) : []; }
function findings(modId) { return groupsOf(modId).flatMap((g) => g.findings); }
const sum = (list) => list.reduce((s, f) => s + f.bytes, 0);
function selectedBytes(modId) { return sum(findings(modId).filter((f) => checked.has(f.id))); }

async function waitJob(id, onProgress) {
  for (;;) {
    const j = await api(`/jobs/${id}`);
    onProgress?.(j);
    if (j.finishedAt) { if (j.error) throw new Error(j.error); return j.result; }
    await new Promise((r) => setTimeout(r, 600));
  }
}

async function scan(modules, fast) {
  const { job } = await api("/scan", { modules, fast });
  $("#main").innerHTML = `<div class="top"><div><h1>Scanning</h1><p>Looking through caches, logs, leftovers and clutter. Sizes are measured as it goes.</p></div></div><pre class="log" id="log"></pre>`;
  await waitJob(job, (j) => { $("#log").textContent = j.progress.slice(-16).join("\n"); });
  await load();
}

/* ---------- main list view ---------- */
function render() {
  for (const m of ["cleanup", "protection", "performance", "applications", "clutter"]) { const el = $("#amt-" + m); const b = report ? selectedBytes(m) : 0; el.textContent = report ? h(b) : ""; el.classList.toggle("has", b > 0); }
  { const el = $("#amt-smart"); const b = report ? selectedBytes() : 0; el.textContent = report ? h(b) : ""; el.classList.toggle("has", b > 0); }
  document.querySelectorAll(".navbtn").forEach((b) => b.dataset.view === view ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  if (view === "space") return renderSpace();
  if (view === "health") return renderHealth();
  if (view === "apps") return renderApps();

  const modId = view === "smart" ? null : view;
  const mods = report ? report.modules.filter((m) => !modId || m.id === modId) : [];
  const selB = selectedBytes(modId), foundB = sum(findings(modId).filter(canClean)), selN = findings(modId).filter((f) => checked.has(f.id)).length;
  let html = `<div class="top"><div><h1>${MODULE_NAMES[view]}</h1><p>${report ? `Last scan ${new Date(report.createdAt).toLocaleString([], { dateStyle: "medium", timeStyle: "short" })} on ${esc(report.host)}` : "Not scanned yet"}</p></div>
    <div class="actions"><button class="btn" id="scan-fast">Quick scan</button><button class="btn primary" id="scan-full">Scan${modId ? " " + MODULE_NAMES[view] : ""}</button></div></div>`;

  if (report && mods.length) {
    const total = disk?.totalBytes || 1, used = disk?.usedBytes || 0;
    const other = Math.max(0, used - foundB), foundRest = Math.max(0, foundB - selB), free = Math.max(0, total - used);
    const pct = (b) => `${(100 * b / total).toFixed(3)}%`;
    html += `<section class="strip" aria-label="Startup disk">
      <div class="num"><b>${h(selB)}</b> would be freed</div>
      <p class="lead">${selN} items are ticked. Ticking or unticking anything below moves the green part of the bar. Everything ticked goes to the Trash, so it can still be brought back.</p>
      <div class="bar"><i class="used" style="width:${pct(other)}"></i><i class="sel" style="width:${pct(selB)}"></i><i class="found" style="width:${pct(foundRest)}"></i></div>
      <div class="legend"><span class="l-used">Everything else <em>${h(other)}</em></span><span class="l-sel">Would be freed <em>${h(selB)}</em></span><span class="l-found">Found, not ticked <em>${h(foundRest)}</em></span><span>Free now <em>${h(free)}</em></span></div>
    </section>`;
  } else {
    html += `<div class="empty"><b>Nothing scanned yet</b>Scan looks through caches, logs, Xcode leftovers, mail attachments, browser traces, old installers and large files, then shows each with its size. Quick scan skips duplicate hashing and takes about a minute.</div>`;
  }

  for (const m of mods) {
    if (!modId) html += `<div class="module-title">${esc(m.title)}<span>${h(sum(m.groups.flatMap((g) => g.findings).filter((f) => checked.has(f.id))))} of ${h(m.bytes)}</span></div>`;
    else html += `<div style="height:4px"></div>`;
    for (const g of m.groups) {
      const cleanable = g.findings.filter(canClean), sel = g.findings.filter((f) => checked.has(f.id)), gSel = sum(sel);
      const isOpen = open.has(g.id);
      html += `<div class="grp${isOpen ? " open" : ""}" data-group="${g.id}">
        <div class="grp-row" role="button" tabindex="0" aria-expanded="${isOpen}">
          <input type="checkbox" data-grp="${g.id}" aria-label="Tick everything in ${esc(g.title)}" ${cleanable.length && sel.length === cleanable.length ? "checked" : ""} ${sel.length && sel.length < cleanable.length ? "data-mixed" : ""} ${cleanable.length ? "" : "disabled"}>
          <div><div class="t">${esc(g.title)}<small>${g.findings.length} ${g.findings.length === 1 ? "item" : "items"}${cleanable.length === 0 && g.findings.length ? ", information only" : ""}</small></div><div class="d">${esc(g.description)}</div></div>
          <div class="bytes">${gSel ? `<b>${h(gSel)}</b> of ` : ""}${h(g.bytes)}</div>
          <div class="chev">›</div>
        </div>`;
      if (g.warning) html += `<div class="notice">${esc(g.warning)}</div>`;
      if (isOpen) {
        html += `<ul class="items">`;
        for (const f of g.findings.slice(0, 400)) {
          const flags = [f.needsRoot ? "needs administrator" : "", f.action === "report" ? "information only" : "", f.action === "command" ? "task" : ""].filter(Boolean).join(", ");
          html += `<li class="item"><input type="checkbox" data-id="${f.id}" aria-label="${esc(f.title)}" ${checked.has(f.id) ? "checked" : ""} ${canClean(f) ? "" : "disabled"}>
            <div><div class="name">${esc(f.title)}${flags ? `<span class="flags">${flags}</span>` : ""}</div><div class="path">${esc(f.path)}${f.note ? ` — ${esc(f.note)}` : ""}</div></div>
            <div class="bytes${checked.has(f.id) ? " on" : ""}">${h(f.bytes)}</div>
            <div class="reveal">${f.path.startsWith("/") ? `<button class="btn small" data-reveal="${esc(f.path)}">Show</button>` : ""}</div></li>`;
        }
        html += `</ul>`;
        if (g.findings.length > 400) html += `<div class="more">${g.findings.length - 400} more are not listed here. The command line lists them all.</div>`;
      }
      html += `</div>`;
    }
  }
  if (report && mods.length) html += `<div class="actions-bar"><span class="sum"><b>${h(selB)}</b> in ${selN} ticked items</span><button class="btn" id="dry" ${selN ? "" : "disabled"}>Preview what changes</button><button class="btn trash" id="clean" ${selN ? "" : "disabled"}>Move to Trash</button></div>`;

  const main = $("#main");
  main.innerHTML = html;
  main.querySelectorAll("input[data-mixed]").forEach((el) => (el.indeterminate = true));
  $("#scan-fast")?.addEventListener("click", () => scan(modId ? [modId] : [], true));
  $("#scan-full")?.addEventListener("click", () => scan(modId ? [modId] : [], false));
  main.querySelectorAll(".grp-row").forEach((el) => {
    const toggle = () => { const id = el.parentElement.dataset.group; open.has(id) ? open.delete(id) : open.add(id); render(); };
    el.addEventListener("click", (e) => { if (e.target.tagName !== "INPUT") toggle(); });
    el.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target === el) { e.preventDefault(); toggle(); } });
  });
  main.querySelectorAll("input[data-grp]").forEach((el) => el.addEventListener("change", () => { const g = groupsOf().find((x) => x.id === el.dataset.grp); for (const f of g.findings) if (canClean(f)) el.checked ? checked.add(f.id) : checked.delete(f.id); render(); }));
  main.querySelectorAll("input[data-id]").forEach((el) => el.addEventListener("change", () => { el.checked ? checked.add(el.dataset.id) : checked.delete(el.dataset.id); render(); }));
  main.querySelectorAll("button[data-reveal]").forEach((el) => el.addEventListener("click", () => api("/reveal", { path: el.dataset.reveal })));
  $("#dry")?.addEventListener("click", () => clean(modId, false));
  $("#clean")?.addEventListener("click", () => clean(modId, true));
}

async function clean(modId, forReal) {
  const list = findings(modId).filter((f) => checked.has(f.id));
  if (!list.length) return;
  const ids = list.map((f) => f.id);
  const dlg = $("#dlg");
  dlg.innerHTML = `<h3>${forReal ? "Move to Trash" : "Preview"}</h3><p id="dp"></p><pre class="log" id="dlog"></pre><div class="dlg-actions" id="da"><button class="btn" id="dclose">Close</button></div>`;
  dlg.showModal();
  $("#dclose").onclick = () => dlg.close();
  if (forReal) {
    $("#dp").textContent = `${ids.length} items, ${h(sum(list))}. They move to the Trash, except browser databases and trash bins, which are deleted outright. Items that need administrator rights are skipped and listed with the command to run.`;
    $("#dlog").textContent = list.slice(0, 60).map((f) => `${h(f.bytes).padStart(9)}  ${f.path}`).join("\n") + (list.length > 60 ? `\n… and ${list.length - 60} more` : "");
    $("#da").insertAdjacentHTML("afterbegin", `<button class="btn trash" id="dgo">Move ${ids.length} items to Trash</button>`);
    await new Promise((res) => { $("#dgo").onclick = res; });
    $("#dgo").remove();
    $("#dp").textContent = "Moving to Trash.";
  } else {
    $("#dp").textContent = "A dry run. Nothing is changed.";
  }
  const { job } = await api("/clean", { ids, confirm: forReal });
  const result = await waitJob(job, (j) => { $("#dlog").textContent = j.progress.slice(-24).join("\n"); });
  const counts = {}; for (const it of result.items) counts[it.status] = (counts[it.status] || 0) + 1;
  $("#dlog").textContent = result.items.map((i) => `${i.status.padEnd(10)} ${h(i.bytes).padStart(9)}  ${i.path}${i.detail ? "  " + i.detail : ""}`).join("\n");
  $("#dp").textContent = `${Object.entries(counts).map(([k, n]) => `${n} ${k.replace("-", " ")}`).join(", ")}${forReal ? `. ${h(result.bytesFreed)} freed.` : `. ${h(sum(list))} would be freed.`}`;
  if (forReal) await load();
}

/* ---------- Space Lens ---------- */
async function renderSpace(path) {
  const main = $("#main");
  main.innerHTML = `<div class="top"><div><h1>Space Lens</h1><p>Measuring${path ? " " + esc(path) : " your home folder"}. Large folders can take a minute.</p></div></div>`;
  const { disk: d, tree } = await api(`/space?depth=2&top=30${path ? `&path=${encodeURIComponent(path)}` : ""}`);
  disk = d;
  const rows = [];
  const walk = (n, depth) => { rows.push({ n, depth }); for (const c of n.children ?? []) walk(c, depth + 1); };
  walk(tree, 0);
  const parent = tree.path.split("/").slice(0, -1).join("/") || "/";
  main.innerHTML = `<div class="top"><div><h1>Space Lens</h1><p>${esc(tree.path)} holds ${h(tree.bytes)}. Click a folder to look inside it.</p></div>
    <div class="actions">${path ? `<button class="btn" id="up">Up to ${esc(parent === "/" ? "/" : parent.split("/").pop())}</button>` : ""}<button class="btn" id="home">Home folder</button></div></div>
    <div class="kv"><div><div class="k">Startup disk</div><div class="v">${h(d.freeBytes)}<small>free of ${h(d.totalBytes)}</small></div><div class="meter"><i style="width:${(100 * d.usedBytes / d.totalBytes).toFixed(1)}%"></i></div></div>${d.purgeableBytes ? `<div><div class="k">Purgeable by macOS</div><div class="v">${h(d.purgeableBytes)}</div></div>` : ""}</div>
    <div class="tree">${rows.map(({ n, depth }) => `<div data-path="${esc(n.path)}" data-nav="${depth > 0 && !n.name.startsWith("(") ? 1 : 0}" style="padding-left:${6 + depth * 20}px"><span class="n${n.bytes > tree.bytes * 0.1 ? " big" : ""}">${h(n.bytes)}</span><span>${esc(n.name)}</span></div>`).join("")}</div>`;
  $("#up")?.addEventListener("click", () => renderSpace(parent));
  $("#home").addEventListener("click", () => renderSpace());
  main.querySelectorAll(".tree div[data-nav='1']").forEach((el) => el.addEventListener("click", () => renderSpace(el.dataset.path)));
}

/* ---------- Health ---------- */
async function renderHealth() {
  const main = $("#main");
  main.innerHTML = `<div class="top"><div><h1>Health</h1><p>Sampling the processor for a few seconds.</p></div></div>`;
  const x = await api("/health");
  disk = x.disk;
  const cpu = x.cpu.userPct != null ? Math.round(x.cpu.userPct + x.cpu.sysPct) : null;
  const kv = (k, v, small, pct) => `<div><div class="k">${k}</div><div class="v">${v}${small ? `<small>${small}</small>` : ""}</div>${pct != null ? `<div class="meter"><i style="width:${Math.min(100, pct).toFixed(1)}%"></i></div>` : ""}</div>`;
  main.innerHTML = `<div class="top"><div><h1>Health</h1><p>Snapshot taken ${new Date(x.at).toLocaleTimeString()}.</p></div><div class="actions"><button class="btn" id="again">Sample again</button></div></div>
    <div class="kv">
      ${kv("Processor", cpu != null ? `${cpu}%` : x.cpu.loadAvg1.toFixed(2), cpu != null ? `busy, ${x.cpu.cores} cores` : "load", cpu)}
      ${kv("Memory", h(x.memory.usedBytes), `of ${h(x.memory.totalBytes)}, pressure ${x.memory.pressure}`, 100 * x.memory.usedBytes / x.memory.totalBytes)}
      ${kv("Disk", h(x.disk.freeBytes), "free", 100 * x.disk.usedBytes / x.disk.totalBytes)}
      ${x.battery ? kv("Battery", `${x.battery.percent}%`, `${x.battery.charging ? "charging" : "on battery"}${x.battery.cycleCount != null ? `, ${x.battery.cycleCount} cycles` : ""}`, x.battery.percent) : ""}
      ${kv("Awake for", `${(x.uptimeSec / 3600).toFixed(1)} h`, x.thermal ? x.thermal : "")}
    </div>
    <h2 class="module-title">Busiest processes</h2>
    <table><tr><th>Process</th><th style="text-align:right">Processor</th><th style="text-align:right">Memory</th></tr>${x.topProcesses.map((p) => `<tr><td>${esc(p.command)} <span class="muted">${p.pid}</span></td><td class="n">${p.cpu.toFixed(1)}%</td><td class="n">${h(p.mem)}</td></tr>`).join("")}</table>
    <h2 class="module-title">Maintenance<span>Tasks that need administrator rights show the command to run in Terminal.</span></h2>
    <table id="perf"></table>`;
  $("#again").addEventListener("click", renderHealth);
  const tasks = await api("/perf");
  $("#perf").innerHTML = tasks.map((t) => `<tr><td><div>${esc(t.title)}${t.needsRoot ? ` <span class="muted">needs administrator</span>` : ""}</div><div class="muted">${esc(t.description)}</div></td><td style="width:90px;text-align:right"><button class="btn small" data-task="${t.id}">Run</button></td></tr>`).join("");
  main.querySelectorAll("button[data-task]").forEach((b) => b.addEventListener("click", async () => {
    b.disabled = true;
    const r = await api(`/perf/${b.dataset.task}`, { confirm: true });
    const dlg = $("#dlg");
    dlg.innerHTML = `<h3>${esc(b.textContent === "Run" ? tasks.find((t) => t.id === b.dataset.task).title : "")}</h3><p>${r.ok ? "Done." : "Not completed. The log below says why."}</p><pre>${esc(r.log.join("\n"))}</pre><div class="dlg-actions"><button class="btn" onclick="this.closest('dialog').close()">Close</button></div>`;
    dlg.showModal();
    b.disabled = false;
  }));
}

/* ---------- Uninstaller ---------- */
async function renderApps() {
  const main = $("#main");
  main.innerHTML = `<div class="top"><div><h1>Uninstaller</h1><p>Measuring installed applications.</p></div></div>`;
  const apps = await api("/apps");
  apps.sort((a, b) => b.bytes - a.bytes);
  main.innerHTML = `<div class="top"><div><h1>Uninstaller</h1><p>${apps.length} applications, ${h(sum(apps))} together. Uninstalling removes the app with its support files, caches and preferences.</p></div><div class="actions"><input type="search" id="q" placeholder="Filter by name" aria-label="Filter applications"></div></div>
    <table><tr><th>Application</th><th style="text-align:right">Last opened</th><th style="text-align:right">Size</th><th></th></tr><tbody id="apps"></tbody></table>`;
  const draw = (q = "") => {
    const rows = apps.filter((a) => a.name.toLowerCase().includes(q) || (a.bundleId || "").toLowerCase().includes(q));
    $("#apps").innerHTML = rows.map((a) => `<tr><td><div>${esc(a.name)} <span class="muted">${esc(a.version || "")}${a.source === "app-store" ? ", App Store" : a.source === "system" ? ", Apple" : ""}</span></div><div class="muted" style="font-size:12px">${esc(a.bundleId || a.path)}</div></td><td class="n">${a.lastUsed ? a.lastUsed.slice(0, 10) : "never"}</td><td class="n">${h(a.bytes)}</td><td style="width:100px;text-align:right">${a.source === "system" ? "" : `<button class="btn small" data-app="${esc(a.path)}">Uninstall</button>`}</td></tr>`).join("") || `<tr><td colspan="4" class="muted">No application matches that.</td></tr>`;
    main.querySelectorAll("button[data-app]").forEach((b) => b.addEventListener("click", () => uninstall(b.dataset.app)));
  };
  draw();
  $("#q").addEventListener("input", (e) => draw(e.target.value.toLowerCase()));
}

async function uninstall(path) {
  const dlg = $("#dlg");
  dlg.innerHTML = `<h3>Uninstall</h3><p id="dp">Finding everything that belongs to this application.</p><pre class="log" id="dlog"></pre><div class="dlg-actions"><button class="btn trash" id="dgo" disabled>Move to Trash</button><button class="btn" id="dclose">Close</button></div>`;
  dlg.showModal();
  $("#dclose").onclick = () => dlg.close();
  const { app, plan } = await api(`/apps/plan?q=${encodeURIComponent(path)}`);
  $("#dp").textContent = `${app.name} ${app.version || ""} and ${plan.length - 1} related ${plan.length === 2 ? "item" : "items"}, ${h(sum(plan))} in total.`;
  $("#dlog").textContent = plan.map((f) => `${h(f.bytes).padStart(9)}  ${f.path}${f.needsRoot ? "  (needs administrator)" : ""}`).join("\n");
  $("#dgo").disabled = false;
  $("#dgo").textContent = `Move ${plan.length} items to Trash`;
  $("#dgo").onclick = async () => {
    $("#dgo").disabled = true;
    const { job } = await api("/uninstall", { q: path, confirm: true });
    const r = await waitJob(job, (j) => { $("#dlog").textContent = j.progress.join("\n"); });
    $("#dlog").textContent = r.items.map((i) => `${i.status.padEnd(10)} ${i.path}${i.detail ? "  " + i.detail : ""}`).join("\n");
    $("#dp").textContent = `Uninstalled. ${h(r.bytesFreed)} freed.`;
  };
}

document.querySelectorAll(".navbtn").forEach((b) => b.addEventListener("click", () => { view = b.dataset.view; render(); }));
load().catch((err) => { $("#main").innerHTML = `<div class="empty"><b>The cleaner service did not answer</b>${esc(err.message)}. Reload once it has started.</div>`; });
</script>
